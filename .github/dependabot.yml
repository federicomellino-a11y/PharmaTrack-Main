version: 2
updates:
  # Frontend: aggiornamenti raggruppati e settimanali, cosi' non arriva una PR
  # per ogni pacchetto. I major restano fuori e si valutano a mano.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    groups:
      minor-e-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # minimatch arriva da eslint 9 (via typescript-eslint), che la tiene
      # alla 3.x: la correzione e' nella 11.x con un'API diversa, quindi
      # ogni tentativo di aggiornarla rompe il lint. E' una catena di soli
      # strumenti di sviluppo, non finisce nel bundle.
      - dependency-name: "minimatch"
        update-types: ["version-update:semver-major"]

  # Backend: requirements.txt e' pinnato, quindi gli aggiornamenti sono
  # mirati e leggibili.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    groups:
      # Solo patch: con le versioni pinnate in produzione un salto 0.x-minor
      # puo' rompere il build (e' successo con fastapi 0.110 -> 0.162).
      patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Gli ignore su litellm, openai e google-generativeai sono spariti con
      # la potatura del 2/11: quei pacchetti non erano importati da nessun
      # file del backend e non sono piu' dichiarati.

  # Le action della CI vanno tenute aggiornate: sono eseguite sul repository.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
