name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compila i moduli Python
        run: python -m compileall -q backend/app backend/server.py

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa le dipendenze
        working-directory: frontend
        run: npm ci
      - name: Lint (nomi non definiti e regole degli hook)
        working-directory: frontend
        run: npm run lint
      - name: Test unitari
        working-directory: frontend
        run: npm test
      - name: Build di produzione
        working-directory: frontend
        run: npm run build
