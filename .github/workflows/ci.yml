name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Serve a lanciare i controlli a mano quando l'evento automatico non arriva
  # (il 5 novembre le PR #164 non ha generato nessun run): stessa CI, stesso
  # verdetto, solo su richiesta.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compila i moduli Python
        run: python -m compileall -q backend/app backend/server.py

  segreti:
    name: Sicurezza (segreti)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # GitHub secret scanning richiede Advanced Security, che su un repo
      # privato personale non c'e'. Questo controllo copre le forme di segreto
      # che abbiamo davvero, sui soli file versionati: due secondi, zero costi.
      - name: Segreti nei file versionati
        run: bash scripts/controlla-segreti.sh

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa le dipendenze
        working-directory: frontend
        run: npm ci
      # Bloccante solo su high/critical nelle dipendenze di produzione: una
      # advisory moderata in un pacchetto di sviluppo non deve fermare un
      # rilascio, ma una grave che finisce nel bundle si'.
      - name: Vulnerabilita' note nelle dipendenze di produzione
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Vulnerabilita' note, quadro completo (non bloccante)
        working-directory: frontend
        continue-on-error: true
        run: npm audit || true
      - name: Lint (nomi non definiti e regole degli hook)
        working-directory: frontend
        run: npm run lint
      - name: Controllo dei tipi (tsc, copre anche .tsx)
        working-directory: frontend
        run: npm run typecheck
      - name: Test unitari
        working-directory: frontend
        run: npm test
      - name: Build di produzione
        working-directory: frontend
        run: npm run build

  e2e:
    name: Frontend (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa le dipendenze
        working-directory: frontend
        run: npm ci
      # Il browser scaricato una volta resta nel runner per i job successivi:
      # senza cache ogni giro riscarica 100 MB e ricasca nella stessa finestra
      # di rete cattiva.
      - name: Cache dei browser Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Installa Chromium per Playwright
        working-directory: frontend
        # L'11/11 il runner non risolveva security.ubuntu.com: `--with-deps`
        # e' morto con exit 100 per tre volte di fila senza eseguire un solo
        # test, e il merge si e' fermato per un guasto di rete.
        # Qui si scarica prima il solo browser headless, che non passa da apt:
        # se parte, i test girano come sempre. Le librerie di sistema si
        # installano solo se il browser davvero non si avvia.
        run: |
          prova() {
            for tentativo in 1 2 3; do
              if "$@"; then echo "ok al tentativo $tentativo: $*"; return 0; fi
              echo "::warning::tentativo $tentativo fallito: $*"
              sleep 15
            done
            return 1
          }
          if prova npx playwright install --only-shell chromium \
             && prova npx playwright screenshot --browser=chromium about:blank /tmp/avvio.png; then
            echo "browser headless pronto senza apt"
            exit 0
          fi
          echo "::warning::il browser non parte da solo: provo con le librerie di sistema"
          prova npx playwright install --with-deps chromium && exit 0
          echo "::error::installazione dei browser fallita anche con --with-deps"
          exit 1
      - name: Build di produzione
        working-directory: frontend
        run: npm run build
      # Il bundle e' pubblico: qualunque cosa ci finisca la legge chiunque.
      # Qui si controlla il file vero, non il sorgente.
      - name: Segreti nel bundle di produzione
        run: bash scripts/controlla-segreti.sh --dist
      - name: Smoke test end-to-end (bundle reale, API finte)
        working-directory: frontend
        run: npm run test:e2e
      - name: Allega il report se qualcosa fallisce
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend-test:
    name: Backend (dipendenze + test unitari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Installa davvero requirements.txt: e' il passo che il 1 novembre e'
      # fallito su Render lasciando il backend giu' per un'ora, e da qui lo
      # vediamo prima del merge invece che in produzione.
      - name: Installa le dipendenze del backend
        run: pip install -r backend/requirements.txt
      - name: Verifica che l'app si importi
        working-directory: backend
        env:
          # Valori finti: servono solo a soddisfare la configurazione, non si
          # collega a niente. Il database non viene mai interrogato.
          MONGO_URL: "mongodb://127.0.0.1:27017"
          DB_NAME: pharmatrack_ci
          JWT_SECRET: ci-placeholder
          SECRET_KEY: ci-placeholder
        run: python -c "import app.core.reporting, app.core.security, app.routers.deliveries, app.routers.drivers"
      - name: Dipendenze senza vulnerabilita' note
        working-directory: backend
        run: |
          pip install --quiet pip-audit
          # Blocca il merge se una dipendenza di produzione ha una
          # vulnerabilita' pubblicata. Oggi e' verde: se diventa rosso
          # significa che e' uscito un advisory vero sui nostri pin.
          pip-audit -r requirements.txt --progress-spinner off

      - name: Test unitari (senza rete e senza database)
        working-directory: backend
        run: python -m pytest tests/unit -q
