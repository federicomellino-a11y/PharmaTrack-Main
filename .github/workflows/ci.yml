name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compila i moduli Python
        run: python -m compileall -q backend/app backend/server.py

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa le dipendenze
        working-directory: frontend
        run: npm ci
      - name: Lint (nomi non definiti e regole degli hook)
        working-directory: frontend
        run: npm run lint
      - name: Test unitari
        working-directory: frontend
        run: npm test
      - name: Build di produzione
        working-directory: frontend
        run: npm run build

  e2e:
    name: Frontend (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa le dipendenze
        working-directory: frontend
        run: npm ci
      - name: Installa Chromium per Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build di produzione
        working-directory: frontend
        run: npm run build
      - name: Smoke test end-to-end (bundle reale, API finte)
        working-directory: frontend
        run: npm run test:e2e
      - name: Allega il report se qualcosa fallisce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
