name: Utente di lettura per i backup

# Crea (o aggiorna) l'utente Mongo con cui gira il backup notturno, cosi' il
# dump non usa piu' le credenziali applicative che possono anche cancellare.
# Si lancia a mano, una volta; poi l'utente resta nel database.

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: 'Scrivi CREA per confermare'
        required: true
        type: string

concurrency: utente-lettura

jobs:
  crea:
    if: inputs.conferma == 'CREA'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pymongo
      - name: Crea l'utente di sola lettura
        env:
          MONGO_URL_ADMIN: ${{ secrets.MONGO_URL_ADMIN }}
          BACKUP_USER: pharmatrack_backup
          BACKUP_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import os, sys
          from pymongo import MongoClient
          from pymongo.errors import OperationFailure

          client = MongoClient(os.environ["MONGO_URL_ADMIN"], serverSelectionTimeoutMS=20000)
          admin = client["admin"]
          utente = os.environ["BACKUP_USER"]
          password = os.environ["BACKUP_PASSWORD"]
          if not password:
              sys.exit("Manca BACKUP_DB_PASSWORD")

          comando = {
              "updateUser": utente,
              "pwd": password,
              "roles": [{"role": "readAnyDatabase", "db": "admin"}],
          }
          try:
              admin.command({"createUser": utente, "pwd": password,
                             "roles": [{"role": "readAnyDatabase", "db": "admin"}]})
              print(f"utente {utente} creato con ruolo readAnyDatabase")
          except OperationFailure as errore:
              if "already exists" not in str(errore):
                  raise
              admin.command(comando)
              print(f"utente {utente} esisteva, password e ruolo aggiornati")

          # verifica: l'utente deve poter leggere ma non scrivere
          ruoli = admin.command({"usersInfo": utente})["users"][0]["roles"]
          print("ruoli effettivi:", ruoli)
          PY
