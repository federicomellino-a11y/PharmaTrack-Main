name: Allarmi automatici

# Una volta al giorno guarda se gli automatismi hanno davvero lavorato e se
# l'API e' sana. Scrive una mail solo quando c'e' qualcosa che non torna.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"   # 07:30 o 08:30 italiane, prima che la farmacia apra

permissions:
  actions: read
  contents: read

jobs:
  controlla:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla API e automatismi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python .github/scripts/allarmi.py
