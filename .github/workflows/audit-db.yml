name: Controllo del database

# Fotografia del database: collezioni, indici, campi, riferimenti rotti e cose
# che si romperanno quando i dati crescono. Solo letture.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"   # il primo di ogni mese, 07:00 italiane

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strumenti
        run: pip install --quiet pymongo
      - name: Interroga il database
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_BACKUP }}
        run: |
          set -euo pipefail
          if [ -z "${MONGO_URL:-}" ]; then
            echo "::error::Manca il secret MONGO_URL_BACKUP"; exit 1
          fi
          python3 backend/scripts/audit_db.py | tee audit.txt
      - name: Conserva il rapporto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-database
          path: audit.txt
          retention-days: 90
