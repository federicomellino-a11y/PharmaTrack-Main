name: Backup database

# Il cluster Atlas e' un piano condiviso: non ha backup automatici, quindi
# questo e' l'unico salvataggio che esiste. Il dump esce cifrato e resta come
# artefatto per 30 giorni; la procedura di ripristino e' in
# docs/BACKUP_RESTORE.md e va provata almeno una volta.
on:
  schedule:
    # 01:30 UTC = 02:30 in Italia (03:30 con l'ora legale)
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  dump:
    name: Dump cifrato del database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Installa mongodump
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc \
            | sudo gpg -o /usr/share/keyrings/mongodb-server-7.0.gpg --dearmor --yes
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq mongodb-database-tools
          mongodump --version

      - name: Scarica il database
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_BACKUP }}
        run: |
          set -euo pipefail
          if [ -z "${MONGO_URL:-}" ]; then
            echo "::error::Manca il secret MONGO_URL_BACKUP"; exit 1
          fi
          STAMP=$(date -u +%Y%m%d-%H%M)
          mkdir -p out
          mongodump --uri "$MONGO_URL" --archive="out/pharmatrack-$STAMP.archive.gz" --gzip
          DIMENSIONE=$(stat -c %s out/pharmatrack-*.archive.gz)
          echo "dump: $DIMENSIONE byte"
          # Un archivio di pochi byte significa dump vuoto: meglio fallire
          # rumorosamente che conservare un backup inutile.
          if [ "$DIMENSIONE" -lt 20000 ]; then
            echo "::error::Dump sospettosamente piccolo ($DIMENSIONE byte)"
            exit 1
          fi

      - name: Verifica che l'utente sia davvero di sola lettura
        env:
          MONGO_URL: ${{ secrets.MONGO_URL_BACKUP }}
        run: |
          set -euo pipefail
          pip install --quiet pymongo
          python3 - <<'PYEOF'
          import os
          from pymongo import MongoClient
          from pymongo.errors import OperationFailure
          client = MongoClient(os.environ["MONGO_URL"], serverSelectionTimeoutMS=20000)
          prova = client["backup_verifica"]["prova"]
          try:
              prova.insert_one({"verifica": True})
          except OperationFailure:
              print("ok: la scrittura viene rifiutata, l'utente e' di sola lettura")
          else:
              prova.drop()
              raise SystemExit("ERRORE: l'utente dei backup puo' scrivere sul database")
          finally:
              client.close()
          PYEOF

      - name: Cifra e cancella il dump in chiaro
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${PASSPHRASE:-}" ]; then
            echo "::error::Manca il secret BACKUP_PASSPHRASE"; exit 1
          fi
          NOME=$(basename out/pharmatrack-*.archive.gz)
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PASSPHRASE" \
            --output "out/${NOME%.archive.gz}.asc" "out/$NOME"
          rm "out/$NOME"
          sha256sum out/*.asc | tee out/SHA256.txt

      - name: Conserva l'artefatto
        uses: actions/upload-artifact@v7
        with:
          name: backup-${{ github.run_number }}
          path: out/
          retention-days: 30
          if-no-files-found: error
