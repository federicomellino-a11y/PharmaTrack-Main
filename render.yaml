services:
  - type: web
    name: pharmatrack-api
    runtime: python
    plan: free
    rootDir: backend
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: Cluster0
      - key: ADMIN_EMAIL
        value: Admin@superadmin.it
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Super Admin
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Deve essere un mittente VALIDATO in Brevo. noreply@pharmatrack.app non lo e':
      # Brevo lo accetta in invio e lo scarta dopo, senza errori (13/11/2026).
      # Si torna a noreply@ solo dopo aver autenticato il dominio in Brevo.
      - key: SMTP_FROM
        value: federicomellino@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
