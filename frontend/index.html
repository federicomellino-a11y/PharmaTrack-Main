<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="alternate icon" href="/logo.webp" type="image/webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2d7a6b" />
    <!-- Anteprima dei link condivisi (WhatsApp, Telegram, LinkedIn).
         L'immagine sta in public/opengraph.jpg, 1280x720. Se un giorno il sito
         passa a un dominio suo, qui e in og:url va cambiato l'indirizzo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PharmaTrack" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://pharmatrack-zeta.vercel.app/" />
    <meta property="og:title" content="PharmaTrack — Gestionale consegne per farmacie" />
    <meta property="og:description" content="Consegne, fattorini, incassi e tracking in un unico posto. Dalla farmacia al cliente, con la prova di consegna." />
    <meta property="og:image" content="https://pharmatrack-zeta.vercel.app/opengraph.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PharmaTrack — Gestionale consegne per farmacie" />
    <meta name="twitter:description" content="Consegne, fattorini, incassi e tracking in un unico posto." />
    <meta name="twitter:image" content="https://pharmatrack-zeta.vercel.app/opengraph.jpg" />
    <!-- Riempito a ogni build da vite.config.ts: dice quale versione sta usando
         il browser di chi ci segnala un problema. -->
    <meta name="app-build" content="__APP_BUILD__" />
    <meta name="description" content="PharmaTrack — Gestionale consegne per farmacie" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PharmaTrack" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet" />
    <title>PharmaTrack</title>
  </head>
  <body>
    <noscript>Devi abilitare JavaScript per usare questa app.</noscript>
    <div id="root"></div>
    <!-- Rete di sicurezza: se il bundle non parte (rete lenta, file non piu
         esistente, cache incoerente) l'utente vede un messaggio con un
         pulsante invece di una pagina bianca senza spiegazioni. -->
    <div id="boot-fallback" style="display:none;position:fixed;inset:0;padding:24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#faf9f6;color:#1f2937;align-items:center;justify-content:center;text-align:center;">
      <div style="max-width:380px;">
        <p style="font-size:17px;font-weight:600;margin:0 0 8px;">PharmaTrack non si e caricato</p>
        <p style="font-size:14px;line-height:1.5;color:#4b5563;margin:0 0 18px;">
          Di solito e la copia dell'app rimasta in memoria dal caricamento precedente.
          Ricarica per scaricare la versione aggiornata.
        </p>
        <button type="button" onclick="var u=new URL(location.href);u.searchParams.set('v',Date.now());location.replace(u.toString());"
          style="background:#2d7a6b;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer;">
          Ricarica l'app
        </button>
      </div>
    </div>
    <script>
      window.__ptBooted = false;
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!window.__ptBooted || !root || root.children.length === 0) {
          var el = document.getElementById('boot-fallback');
          if (el) el.style.display = 'flex';
        }
      }, 9000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
